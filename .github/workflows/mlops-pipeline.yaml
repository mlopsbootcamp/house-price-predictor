# .github/workflows/mlops-pipeline.yml
name: MLOps Pipeline

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all jobs'
        required: false
        default: 'true'
      run_data_processing:
        description: 'Run data processing job'
        required: false
        default: 'false'
      run_model_training:
        description: 'Run model training job'
        required: false
        default: 'false'
      run_build_and_publish:
        description: 'Run build and publish job'
        required: false
        default: 'false'
  release:
    types: [created]
    branches: [ main ]
    tags: [ 'v*.*.*' ]


jobs:
  data-processing:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Process data
      run: |
        python src/data/run_processing.py --input data/raw/house_data.csv --output data/processed/cleaned_house_data.csv 
        
    - name: Engineer features
      run: |
        python src/features/engineer.py --input data/processed/cleaned_house_data.csv --output data/processed/featured_house_data.csv --preprocessor models/trained/preprocessor.pkl
        
    - name: Upload processed data
      uses: actions/upload-artifact@v7
      with:
        name: processed-data
        path: data/processed/featured_house_data.csv
        
    - name: Upload preprocessor
      uses: actions/upload-artifact@v7
      with:
        name: preprocessor
        path: models/trained/preprocessor.pkl
        
  model-training:
    needs: data-processing
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download processed data
      uses: actions/download-artifact@v7
      with:
        name: processed-data
        path: data/processed/
        
    - name: Set up MLflow
      run: |
        docker pull ghcr.io/mlflow/mlflow:latest
        docker run -d -p 5000:5000 --name mlflow-server ghcr.io/mlflow/mlflow:latest mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db
        
    - name: Wait for MLflow to start
      run: |
        for i in {1..10}; do
          curl -f http://localhost:5000/health || sleep 5;
        done
        
    - name: Train model
      run: |
        mkdir -p models
        python src/models/train_model.py --config configs/model_config.yaml --data data/processed/featured_house_data.csv --models-dir models --mlflow-tracking-uri http://localhost:5000
        
    - name: Upload trained model
      uses: actions/upload-artifact@v7
      with:
        name: trained-model
        path: models/
        
    - name: Clean up MLflow
      run: |
        docker stop mlflow-server || true
        docker rm mlflow-server || true
        
  build-and-publish:
    needs: model-training
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Download trained model
      uses: actions/download-artifact@v7
      with:
        name: trained-model
        path: models/
        
    - name: Download preprocessor
      uses: actions/download-artifact@v7
      with:
        name: preprocessor
        path: models/trained/
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      
    - name: Build and test Docker image
      run: |
        COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)
        docker build -t docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:$COMMIT_HASH -f Dockerfile .
        docker run -d -p 8000:8000 --name test-api docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:$COMMIT_HASH
        for i in {1..10}; do
          curl -f http://localhost:8000/health && break || sleep 5;
        done
        docker logs test-api
        curl -fsS http://localhost:8000/health

    - name: Clean up Test Container
      run: |
        docker stop test-api || true
        docker rm test-api || true
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: docker.io
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
     
    - name: Push Docker image to DockerHub
      run: |
        COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)
        docker tag docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:$COMMIT_HASH docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:latest
        docker push docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:$COMMIT_HASH
        docker push docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model:latest

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-24.04
    environment: kthw-lab
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: house-price-deploy
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ vars.KTHW_DEPLOY_ROLE_ARN }}
        aws-region: ${{ vars.KTHW_AWS_REGION }}
    - name: Find running jumpbox
      id: jumpbox
      run: |
        instances=$(aws ec2 describe-instances --filters 'Name=tag:Name,Values=jumpbox' 'Name=tag:ManagedBy,Values=kubernetes-hard-way' 'Name=instance-state-name,Values=running' --query 'Reservations[].Instances[].InstanceId' --output text)
        count=$(wc -w <<< "$instances")
        if [ "$count" -gt 1 ]; then
          echo "Multiple running jumpboxes found" >&2
          exit 1
        fi
        echo "instance=$instances" >> "$GITHUB_OUTPUT"
        if [ "$count" -eq 0 ]; then
          echo "Cluster jumpbox is stopped or absent; deployment skipped." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Deploy Helm release
      if: steps.jumpbox.outputs.instance != ''
      env:
        JUMPBOX: ${{ steps.jumpbox.outputs.instance }}
        KUBECONFIG_CONTENT: ${{ secrets.KTHW_DEPLOY_KUBECONFIG }}
        IMAGE_REPOSITORY: docker.io/${{ vars.DOCKERHUB_USERNAME }}/house-price-model
      run: |
        set -euo pipefail
        umask 077
        export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
        printf '%s' "$KUBECONFIG_CONTENT" > "$KUBECONFIG"
        aws ssm start-session --target "$JUMPBOX" --document-name house-price-kubernetes-api > "$RUNNER_TEMP/ssm.log" 2>&1 &
        tunnel_pid=$!
        trap 'kill "$tunnel_pid" 2>/dev/null || true; rm -f "$KUBECONFIG"' EXIT
        for attempt in {1..30}; do
          if (echo > /dev/tcp/127.0.0.1/16443) 2>/dev/null; then break; fi
          if ! kill -0 "$tunnel_pid" 2>/dev/null; then cat "$RUNNER_TEMP/ssm.log"; exit 1; fi
          sleep 1
        done
        kubectl --request-timeout=10s get --raw=/version >/dev/null
        helm upgrade --install house-price ./deployment/kubernetes/house-price-model \
          --namespace house-price --wait --timeout 5m \
          --set-string "api.image.repository=$IMAGE_REPOSITORY" \
          --set-string "api.image.tag=${GITHUB_SHA:0:7}"
